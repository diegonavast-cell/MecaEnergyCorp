<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="padre">

        <div class="hijo2" id="seccionRegistro">
            <center>
                <h1>Registro</h1>

                <label for="usuarioRegistro">Usuario:</label>
                <input type="text" id="usuarioRegistro">

                <br><br>

                <label for="contrasenaRegistro">Contraseña:</label>
                <input type="password" id="contrasenaRegistro">

                <br><br>

                <label for="confirmarRegistro">Confirmar contraseña:</label>
                <input type="password" id="confirmarRegistro">

                <br><br>

                <button type="button" onclick="registrar()">Registrarse</button>
            </center>
        </div>

        <div class="hijo" id="seccionLogin" style="display: none;">
            <center>
                <h1>Inicio</h1>

                <form onsubmit="iniciarSesion(event)">
                    <label for="username">Usuario:</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                    >

                    <br><br>

                    <label for="password">Contraseña:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >

                    <br><br>

                    <input
                        type="submit"
                        value="Iniciar sesión"
                    >
                </form>
            </center>
        </div>

    </div>

    <script src="codigo.js"></script>
</body>
</html>
